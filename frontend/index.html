<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Al Naeem Jewellery — Dubai Gold Souk</title>
    <meta name="description" content="Two shops in Dubai Gold Souk, Deira. Live gold rates in AED for 24K, 22K, 21K, 18K, 14K. Honest prices, family-run since 1989." />
    <meta name="keywords" content="gold jewellery Dubai, Dubai Gold Souk, gold rates AED, 22K gold Dubai, Deira gold shop, Al Naeem Jewellery" />

    <!-- Open Graph — controls how links look on WhatsApp, Instagram, Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Al Naeem Jewellery — Dubai Gold Souk" />
    <meta property="og:description" content="Two shops in Dubai Gold Souk, Deira. Live gold rates in AED. Honest prices, family-run since 1989." />
    <meta property="og:locale" content="en_AE" />

    <!-- Structured data — tells Google this is a local business -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "JewelryStore",
      "name": "Al Naeem Jewellery",
      "description": "Family-run gold jewellery shop in Dubai Gold Souk, Deira. Serving the community since 1989 with honest prices and live gold rates.",
      "foundingDate": "1989",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "Gold Souk, Near Gold Center",
        "addressLocality": "Deira",
        "addressRegion": "Dubai",
        "addressCountry": "AE"
      },
      "openingHoursSpecification": [
        {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": ["Saturday","Sunday","Monday","Tuesday","Wednesday","Thursday"],
          "opens": "10:30",
          "closes": "22:30"
        },
        {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": "Friday",
          "opens": "16:30",
          "closes": "22:30"
        }
      ],
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "customer service",
        "availableLanguage": ["English","Urdu","Hindi","Bengali","Arabic"]
      },
      "currenciesAccepted": "AED",
      "priceRange": "$$"
    }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
